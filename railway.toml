[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Build cannot reach mysql.railway.internal; schema sync runs when the service starts.
preDeployCommand = "npx prisma db push"
startCommand = "HOSTNAME=0.0.0.0 node .next/standalone/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
